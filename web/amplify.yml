version: 1
# Monorepo build spec for AWS Amplify Hosting. In the Amplify Console, set
# this app's "App root directory" (monorepo settings) to `web` - Amplify
# then runs each phase's commands with that as the working directory, and
# resolves `artifacts.baseDirectory` relative to it.
frontend:
  phases:
    preBuild:
      commands:
        # pnpm workspace: installs must run from the repo root so
        # workspace:* links (schema -> web) resolve.
        - cd .. && corepack enable && corepack prepare pnpm@8.15.1 --activate && pnpm install --frozen-lockfile
    build:
      commands:
        - cd .. && pnpm --filter @invoice-extractor/web build
  artifacts:
    # web/dist - the Vite production build (vite.config.ts: build.outDir)
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - ../node_modules/**/*
